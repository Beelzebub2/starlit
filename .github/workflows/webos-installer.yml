name: Starlit TV Installer (Samsung and LG)
on:
  pull_request:
    paths: ['tv-installer/**', '.github/workflows/webos-installer.yml']
  push:
    branches: [Dev]
    tags: ['v*']
    paths: ['tv-installer/**', '.github/workflows/webos-installer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tv-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tv-installer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tv-installer/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Build preview package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { (Get-Content package.json | ConvertFrom-Json).version }
          npm run dist:win -- "--config.extraMetadata.version=$version"
          if ($LASTEXITCODE -ne 0) { throw 'TV installer packaging failed.' }
      - uses: actions/upload-artifact@v7
        with:
          name: Starlit-TV-Installer-Windows-unverified
          path: tv-installer/dist/Starlit-TV-Installer-Windows-*.exe
          if-no-files-found: error
