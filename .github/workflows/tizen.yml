name: Samsung Tizen
on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact version tag whose unsigned Tizen package is built for the main release
        required: true
        type: string
  pull_request:
    paths: ['tizen/**', '.github/workflows/tizen.yml', '.github/workflows/windows-release.yml', 'composeApp/src/desktopMain/kotlin/com/nuvio/app/features/myanimelist/**']
  push:
    branches: [Dev]
    paths: ['tizen/**', '.github/workflows/tizen.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tizen-${{ inputs.release_tag || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  build:
    # Unsigned developer packages are included with tagged releases as clearly
    # marked previews; Store/stable acceptance remains a separate physical gate.
    runs-on: ubuntu-latest
    env:
      TRAKT_CLIENT_ID: ${{ vars.TRAKT_CLIENT_ID }}
    defaults:
      run:
        working-directory: tizen
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tizen/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix engine-runtime
      - run: npm run build:engine
      - run: npm test --prefix engine-runtime
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - name: Match native stable release version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/starlit-release-version.mjs "$RELEASE_TAG"
      - run: npm run package:tizen
      - run: npm run verify:package
      - name: Verify reproducible unsigned package
        run: |
          cp artifacts/SHA256SUMS-Tizen /tmp/starlit-first-sums
          npm run package:tizen
          cmp /tmp/starlit-first-sums artifacts/SHA256SUMS-Tizen
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_tag && 'starlit-tizen-preview' || 'Starlit-Tizen-unsigned' }}
          path: |
            tizen/artifacts/Starlit-Tizen-*.wgt
            tizen/artifacts/SHA256SUMS-Tizen
            tizen/artifacts/apps2samsung-feed.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Starlit-Tizen-browser-evidence
          path: tizen/test-results/**
          if-no-files-found: error
