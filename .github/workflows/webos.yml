name: LG webOS TV
on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact version tag whose unsigned webOS package is built for the main release
        required: true
        type: string
  pull_request:
    paths: ['tizen/**', '.github/workflows/webos.yml', '.github/workflows/windows-release.yml']
  push:
    branches: [Dev]
    paths: ['tizen/**', '.github/workflows/webos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webos-${{ inputs.release_tag || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  build:
    # Package identity/checksums are verified, but physical LG device support is
    # not certified. Main releases label these artifacts as developer previews.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tizen
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tizen/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --omit=dev --ignore-scripts --prefix ../tv-installer
      - run: npm run lint
      - run: npm test
      - run: npm run test:webos
      - name: Require stable app version on tagged release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/starlit-release-version.mjs "$RELEASE_TAG"
      - run: npm run package:webos
      - run: npm run verify:package:webos
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_tag && 'starlit-webos-preview' || 'Starlit-WebOS-unverified' }}
          path: |
            tizen/artifacts/Starlit-WebOS-*.ipk
            tizen/artifacts/SHA256SUMS-WebOS
            tizen/artifacts/webos-package-metadata.json
          if-no-files-found: error
